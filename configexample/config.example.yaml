# 依赖版本在 go.mod 管理;本地开发复制为 config.yaml 使用。
# 容器部署:挂载宿主目录到 /data,本文件放 /data/config/config.yaml,
# data_dir 与 plugins_dir 用容器内绝对路径(见 README 部署节)
listen: ":8080"
data_dir: "./data"
api_keys:
  - "sk-local-dev-key"
admin_user: "admin"
# 管理口令:明文或 bcrypt 哈希($2a$/$2b$/$2x$/$2y$ 开头按哈希解析,以此开头的明文口令不可用);空则启动生成随机口令打印一次
admin_pass_bcrypt: ""
log_level: "info"
plugins_dir: "./plugins"

# 请求历史保留天数(管理台"请求历史"页;独立 SQLite 文件 history.db;<0 永久保留,0 视为未配置取默认)
history_retention_days: 7

# 全局传输实例(部署资产,target 按名引用;仅 yaml 可表达嵌套)
# url scheme 判型:direct(字面值)|socks5://|http://|https://|aap://|ipp+<kind>://
# 管理面 /admin → 监控 → 传输实例:可对每个实例做连通测试与失效命令(evict)
transports: []
