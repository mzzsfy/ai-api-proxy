# 依赖版本在 go.mod 管理;本地开发复制为 config.yaml 使用。
# 容器部署:挂载宿主目录到 /data,本文件放 /data/config/config.yaml,
# data_dir 与 plugins_dir 用容器内绝对路径(见 README 部署节)
listen: ":8080"
data_dir: "./data"
api_keys:
  - "sk-local-dev-key"
admin_user: "admin"
# 空口令则启动生成随机口令打印一次
admin_pass_bcrypt: ""
log_level: "info"
plugins_dir: "./plugins"

# 全局传输实例(部署资产,target 按名引用;仅 yaml 可表达嵌套)
# 管理面 /admin → 监控 → 传输实例:可对每个实例做连通测试(ipp_* 同时展示出口 IP)
