name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 默认形态:零私有依赖(warp 走 withwarp 标签、mihomo 走 withproxy 标签,均不进默认构建)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Drop local replaces
        # go.mod 的 replace/require 指向本地同级 checkout(离线开发用);
        # 默认构建不 import 这些模块(标签隔离),直接剥掉即可,无需任何网络拉取。
        run: |
          go mod edit -dropreplace=github.com/mzzsfy/warp-pool -droprequire=github.com/mzzsfy/warp-pool
          go mod edit -dropreplace=github.com/mzzsfy/ai-api-proxy-plugin-proxy -droprequire=github.com/mzzsfy/ai-api-proxy-plugin-proxy
      - name: Go test (race)
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  # withwarp 形态:warp-pool 已公开,可自由拉取
  test-withwarp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve warp-pool
        run: |
          go mod edit -dropreplace=github.com/mzzsfy/warp-pool -droprequire=github.com/mzzsfy/warp-pool
          go mod edit -dropreplace=github.com/mzzsfy/ai-api-proxy-plugin-proxy -droprequire=github.com/mzzsfy/ai-api-proxy-plugin-proxy
          go get github.com/mzzsfy/warp-pool@v0.1.0
          go mod tidy
      - name: Build withwarp
        run: go build -tags withwarp ./...
      - name: Test withwarp
        run: go test -tags withwarp ./...

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
