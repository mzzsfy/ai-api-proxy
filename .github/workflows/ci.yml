name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve published modules
        # go.mod 的 replace 指向本地同级 checkout(离线开发用);CI 上换成已发布版本。
        # 依赖库(warp-pool / ai-api-proxy-plugin-proxy)为私有库时:在此步前配 PAT insteadOf,
        # 并设 GOPRIVATE=github.com/mzzsfy/*;公开库则无需任何 secret。
        env:
          GOPRIVATE: github.com/mzzsfy/*
        run: |
          go mod edit -dropreplace=github.com/mzzsfy/warp-pool -droprequire=github.com/mzzsfy/warp-pool
          go mod edit -dropreplace=github.com/mzzsfy/ai-api-proxy-plugin-proxy -droprequire=github.com/mzzsfy/ai-api-proxy-plugin-proxy
          go get github.com/mzzsfy/warp-pool@v0.1.0 github.com/mzzsfy/ai-api-proxy-plugin-proxy@v0.1.0
          go mod tidy
      - name: Go test (race)
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  # withproxy 形态:mihomo 内核集成(vless/vmess 等;依赖 warp-pool@v0.1.0 + plugin-proxy@v0.1.0)
  test-withproxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve published modules
        env:
          GOPRIVATE: github.com/mzzsfy/*
        run: |
          go mod edit -dropreplace=github.com/mzzsfy/warp-pool -droprequire=github.com/mzzsfy/warp-pool
          go mod edit -dropreplace=github.com/mzzsfy/ai-api-proxy-plugin-proxy -droprequire=github.com/mzzsfy/ai-api-proxy-plugin-proxy
          go get github.com/mzzsfy/warp-pool@v0.1.0 github.com/mzzsfy/ai-api-proxy-plugin-proxy@v0.1.0
          go mod tidy
      - name: Build withproxy
        run: go build -tags withproxy ./...
      - name: Test withproxy
        run: go test -tags withproxy ./...

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
