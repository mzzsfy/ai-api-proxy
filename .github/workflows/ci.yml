name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go test (race)
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  # withproxy 形态:mihomo 内核集成(vless/vmess 等;依赖 ai-api-proxy-plugin-proxy + warp-pool 公开可达,无 replace)
  test-withproxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Strip local replaces
        run: |
          sed -i '/^replace github.com\/mzzsfy/d' go.mod
          go mod tidy
      - name: Build withproxy
        run: go build -tags withproxy ./...
      - name: Test withproxy
        run: go test -tags withproxy ./...

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
