# 依赖版本在 go.mod 管理;此文件仅本地开发复制为 config.yaml 使用
listen: ":8080"
data_dir: "./data"
api_keys:
  - "sk-local-dev-key"
admin_user: "admin"
# 空口令则启动生成随机口令打印一次
admin_pass_bcrypt: ""
log_level: "info"
plugins_dir: "./plugins"

# 全局传输实例(部署资产,target 按名引用;仅 yaml 可表达嵌套)
# 管理面 /admin → 监控 → 传输实例:可对每个实例做连通测试
transports: []
#  - name: cn-relay
#    type: http_proxy        # direct | http_proxy | socks5
#    url: "http://user:pass@host:port"
#  - name: socks-relay
#    type: socks5
#    url: "socks5://user:pass@host:port"

# 传输健康周期探测(秒;0 或缺省=关闭,仅保留管理台手动"测试连通")
# 开启后按周期对全部传输实例发一次 HEAD(默认探 gstatic 204),结果展示在管理台监控页
transport_probe_interval_sec: 0
