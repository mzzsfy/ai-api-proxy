<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-api-proxy 控制台</title>
<style>
  /* 主题 token:浅色默认,html[data-theme=dark] 整组覆盖;canvas 用色经 JS 读变量 */
  :root {
    --bg0:#F4F5F7; --bg1:#FFFFFF; --bg-hover:#F7F8FA; --bg-input:#FFFFFF;
    --line:#E4E7EB; --line-soft:#EEF0F3;
    --ink:#182230; --dim:#667085; --faint:#98A2B3;
    --acc:#0E7A8D; --acc-ink:#FFFFFF; --acc-weak:rgba(14,122,141,.09);
    --warn:#DC6803; --err:#D92D20; --ok:#079455;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  html[data-theme="dark"] {
    --bg0:#101418; --bg1:#161B21; --bg-hover:#1B222B; --bg-input:#12171D;
    --line:#232B34; --line-soft:#1A212A;
    --ink:#E6EBF0; --dim:#8B98A5; --faint:#5A6774;
    --acc:#3ECFBB; --acc-ink:#0B1512; --acc-weak:rgba(62,207,187,.10);
    --warn:#FDB022; --err:#F97066; --ok:#32D583;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg0); color:var(--ink); min-height:100vh;
  }
  a { color:var(--acc); text-decoration:none; }
  a:hover { text-decoration:underline; }
  h2 { font-size:18px; font-weight:650; letter-spacing:-0.01em; margin:2px 0 16px; }
  h3 { font-size:13.5px; font-weight:650; margin:22px 0 8px; }
  table { border-collapse:collapse; width:100%; margin:10px 0; font-size:13px; }
  th { text-align:left; font-weight:600; color:var(--dim); font-size:12px; padding:6px 10px;
       border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:6px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  tr:hover td { background:var(--bg-hover); }
  input,textarea,select {
    font:inherit; color:var(--ink); background:var(--bg-input);
    border:1px solid var(--line); border-radius:6px; padding:5px 9px;
  }
  input:focus,textarea:focus,select:focus { outline:none; border-color:var(--acc); }
  input[type=checkbox] { accent-color:var(--acc); }
  textarea { font-family:var(--mono); font-size:12.5px; width:100%; line-height:1.6; }
  button {
    font:inherit; color:var(--ink); background:var(--bg1);
    border:1px solid var(--line); border-radius:6px; padding:5px 13px; cursor:pointer;
  }
  button:hover { border-color:var(--dim); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
  button.pri { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:600; }
  button.pri:hover { filter:brightness(1.06); }
  button.danger { color:var(--err); }
  button.danger:hover { border-color:var(--err); }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .muted { color:var(--dim); font-size:12px; }
  .row { margin:12px 0; }
  pre.log {
    font-family:var(--mono); font-size:12px; line-height:1.6; white-space:pre-wrap;
    background:var(--bg1); border:1px solid var(--line-soft); border-radius:8px;
    padding:12px 14px; max-height:320px; overflow:auto; color:var(--dim);
  }
  /* 布局:左栏导航(分组)+ 主区 */
  .shell { display:flex; min-height:100vh; }
  nav {
    width:186px; flex:none; padding:20px 12px 16px; background:var(--bg1);
    border-right:1px solid var(--line-soft); display:flex; flex-direction:column; gap:2px;
  }
  .brand { font-weight:700; font-size:13.5px; letter-spacing:-0.01em; padding:0 10px 14px; }
  .brand i { font-style:normal; color:var(--acc); }
  .navgroup { font-size:11px; color:var(--faint); padding:12px 10px 3px; }
  nav a { display:block; padding:6px 10px; border-radius:6px; color:var(--dim); cursor:pointer; font-size:13.5px; }
  nav a:hover { color:var(--ink); background:var(--bg-hover); text-decoration:none; }
  nav a.on { color:var(--acc); background:var(--acc-weak); font-weight:600; }
  nav .gap { flex:1; }
  nav button.mini { padding:4px 10px; font-size:12.5px; text-align:left; color:var(--dim); background:none; border:none; }
  nav button.mini:hover { color:var(--ink); }
  #logout { color:var(--err); margin-top:10px; }
  main { flex:1; padding:24px 30px 48px; max-width:1200px; }
  @media (max-width:680px) {
    .shell { flex-direction:column; }
    nav { width:auto; flex-direction:row; align-items:center; flex-wrap:wrap; padding:10px 14px; }
    .brand { padding:0 10px; } .navgroup { display:none; } nav .gap { flex:1; }
    nav button.mini { width:auto; } #logout { margin:0; }
    main { padding:18px 16px 40px; }
  }
  /* 登录 */
  .gate { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .gate .panel { width:320px; background:var(--bg1); border:1px solid var(--line-soft); border-radius:10px; padding:30px 28px 26px; }
  .gate h2 { margin-bottom:20px; }
  .gate label { display:block; color:var(--dim); font-size:12px; margin:14px 0 5px; }
  .gate input { width:100%; }
  .gate button { width:100%; margin-top:20px; padding:8px; }
  /* 提示条 */
  #msg {
    position:fixed; top:14px; right:14px; z-index:9; padding:9px 16px; border-radius:8px;
    display:none; font-size:13px; max-width:60vw; box-shadow:0 6px 24px rgba(16,24,40,.12);
  }
  /* 监控:脉搏带(记忆点)+ 指标行 */
  .pulse { display:flex; align-items:flex-end; gap:34px; flex-wrap:wrap;
           border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:6px; }
  .pulse .big .v { font-family:var(--mono); font-variant-numeric:tabular-nums;
                   font-size:50px; line-height:1; font-weight:600; letter-spacing:-0.02em; color:var(--acc); }
  .pulse .big .l { color:var(--dim); font-size:12.5px; margin-top:8px; }
  .pulse .big .l b { color:var(--ink); font-weight:600; }
  .pulse .mini .v { font-family:var(--mono); font-variant-numeric:tabular-nums;
                    font-size:22px; line-height:1; font-weight:600; }
  .pulse .mini .l { color:var(--dim); font-size:11.5px; margin:6px 0 6px; }
  .stats { display:flex; gap:34px; flex-wrap:wrap; margin:18px 0 4px; }
  .stat .v { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:22px; font-weight:600; }
  .stat .v.warn { color:var(--warn); } .stat .v.err { color:var(--err); } .stat .v.acc { color:var(--acc); }
  .stat .l { color:var(--dim); font-size:12px; margin-top:3px; }
  .empty { color:var(--faint); padding:26px 0; text-align:center; }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line-soft);
           background:var(--bg-hover); color:var(--dim); font-size:11px; }
  .titlerow { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .titlerow h2 { margin-bottom:8px; }
  /* 卡片面板(插件配置详情/对话测试) */
  .card { background:var(--bg1); border:1px solid var(--line-soft); border-radius:8px; padding:16px 18px; margin:12px 0; }
  /* 插件配置:选择列表 + 详情 */
  .plugconf { display:flex; gap:22px; align-items:flex-start; }
  .plugconf .plist { width:210px; flex:none; background:var(--bg1); border:1px solid var(--line-soft);
                     border-radius:8px; padding:8px; }
  .plugconf .plist a { display:block; padding:7px 10px; border-radius:6px; color:var(--dim); cursor:pointer; font-size:13px; }
  .plugconf .plist a:hover { background:var(--bg-hover); color:var(--ink); text-decoration:none; }
  .plugconf .plist a.on { color:var(--acc); background:var(--acc-weak); font-weight:600; }
  .plugconf .pdetail { flex:1; min-width:0; }
  .meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
          background:var(--bg1); border:1px solid var(--line-soft); border-radius:8px; padding:12px 14px; }
  .meta .name { font-weight:650; font-size:15px; }
  .meta .ops { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  /* tabs */
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin:14px 0 16px; }
  .tabs a { padding:8px 14px; color:var(--dim); cursor:pointer; font-size:13.5px;
            border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs a:hover { color:var(--ink); text-decoration:none; }
  .tabs a.on { color:var(--acc); border-bottom-color:var(--acc); font-weight:600; }
  .tabpane { display:none; }
  .tabpane.on { display:block; }
  /* 表单槽位 */
  .slot { margin:10px 0; max-width:520px; }
  .slot label { display:block; color:var(--dim); font-size:12px; margin-bottom:4px; }
  .slot input[type=text], .slot input[type=number], .slot select { width:100%; }
  .ferr { color:var(--err); font-size:11px; }
  /* 对话测试面板 */
  .chatbox { display:grid; grid-template-columns:1fr; gap:10px; }
  .chatbox .out { font-family:var(--mono); font-size:12.5px; line-height:1.6; white-space:pre-wrap;
                  background:var(--bg-hover); border:1px solid var(--line-soft); border-radius:8px;
                  padding:12px 14px; max-height:360px; overflow:auto; min-height:60px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="msg"></div>
<div id="app"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>\"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => new Intl.NumberFormat("en-US").format(n);

/* ─── 主题:双主题切换 + canvas 重绘注册 ─── */
const THEME_KEY = "theme";
const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
const initialTheme = localStorage.getItem(THEME_KEY) || (prefersDark ? "dark" : "light");
let canvasDraws = {}; // 当前页的图表绘制函数(按 key 去重;主题切换时全量重绘)
const registerDraw = (key, fn) => canvasDraws[key] = fn;
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem(THEME_KEY, t);
  const btn = $("#themetoggle");
  if (btn) btn.textContent = t === "dark" ? "浅色" : "深色";
  Object.values(canvasDraws).forEach(fn => { try { fn(); } catch (e) {} });
}
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const api = {
  async call(method, path, body, raw, rawBytes) {
    const opt = { method, headers: {} };
    if (rawBytes !== undefined) {
      opt.body = rawBytes;
      opt.headers["Content-Type"] = "application/octet-stream";
    } else if (body !== undefined) {
      opt.body = typeof body === "string" ? body : JSON.stringify(body);
      opt.headers["Content-Type"] = "application/json";
    }
    const r = await fetch("/admin/api" + path, opt);
    if (r.status === 401) { show("login"); throw new Error("登录已过期"); }
    const data = raw ? await r.text() : await r.json();
    if (!r.ok) throw new Error(data.error || data.message || ("HTTP " + r.status));
    return data;
  },
  get: (p, raw) => api.call("GET", p, undefined, raw),
  post: (p, b) => api.call("POST", p, b),
  put: (p, b) => api.call("PUT", p, b),
  del: p => api.call("DELETE", p),
};
function msg(ok, text) {
  const el = $("#msg");
  el.style.background = ok ? "var(--acc)" : "var(--err)";
  el.style.color = ok ? "var(--acc-ink)" : "#fff";
  el.textContent = text; el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", 3200);
}

/* ─── 外壳与路由:资源(模型管理/插件管理/插件配置) + 观测(监控/请求历史) ─── */
const PAGES = { ups: showUpstreams, pkgs: showPackages, plugconf: showPlugConf, mon: showMonitor, hist: showHistory };
const PAGE_NAMES = { ups: "模型管理", pkgs: "插件管理", plugconf: "插件配置", mon: "监控", hist: "请求历史" };
function shell(page, mainHTML) {
  canvasDraws = [];
  $("#app").innerHTML = `
    <div class="shell">
      <nav>
        <div class="brand">ai-api-proxy<i>_</i>控制台</div>
        <div class="navgroup">资源</div>
        <a data-p="ups">模型管理</a><a data-p="pkgs">插件管理</a><a data-p="plugconf">插件配置</a>
        <div class="navgroup">观测</div>
        <a data-p="mon">监控</a><a data-p="hist">请求历史</a>
        <div class="gap"></div>
        <button class="mini" id="themetoggle"></button>
        <a id="logout">退出</a>
      </nav>
      <main id="main">${mainHTML}</main>
    </div>`;
  document.querySelectorAll("nav a[data-p]").forEach(a => {
    a.classList.toggle("on", a.dataset.p === page);
    a.onclick = () => show(a.dataset.p);
  });
  $("#themetoggle").onclick = () =>
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  applyTheme(document.documentElement.dataset.theme || initialTheme);
  $("#logout").onclick = async () => {
    try { await api.post("/logout", {}); } catch (e) {}
    sessionStorage.removeItem("in"); show("login");
  };
}
function show(page) {
  if (page === "login") {
    $("#app").innerHTML = `
      <div class="gate"><div class="panel">
        <h2>控制台登录</h2>
        <form id="lf">
          <label for="u">用户名</label>
          <input id="u" value="admin" autocomplete="username">
          <label for="p">口令</label>
          <input id="p" type="password" autocomplete="current-password">
          <button class="pri">登录</button>
        </form>
      </div></div>`;
    $("#lf").onsubmit = async e => {
      e.preventDefault();
      try {
        await api.post("/login", { user: $("#u").value, password: $("#p").value });
        sessionStorage.setItem("in", "1"); show("ups");
      } catch (err) { msg(false, err.message); }
    };
    return;
  }
  shell(page, `<h2>${PAGE_NAMES[page]}</h2><div class="muted">载入中…</div>`);
  PAGES[page]();
}
/* ─── 模型管理(上游) ─── */
async function showUpstreams() {
  const [ups, pkgs, transports] = await Promise.all([api.get("/upstreams"), api.get("/packages"), api.get("/transports")]);
  const basePkgs = pkgs.filter(p => p.hasProtocol);
  $("#main").innerHTML = `
    <h2>模型管理</h2>
    <div class="row"><button class="pri" id="newu">新建上游</button></div>
    ${ups.length ? `<table>
      <tr><th>ID</th><th>名称</th><th>主包</th><th>附加</th><th>模型</th><th>目标</th><th>启用</th><th></th></tr>
      ${ups.map(u => `<tr>
        <td class="num">${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.base.package)}</td>
        <td>${(u.extras || []).map(e => esc(e.package)).join(",") || '<span class="muted">—</span>'}</td>
        <td>${esc((u.models || []).join(","))}</td>
        <td>${(u.targets || []).map(t => esc(t.name) + (t.enabled === false ? '<span class="muted">(停)</span>' : "")).join("<br>")}</td>
        <td>${u.enabled ? '<span style="color:var(--ok)">✓</span>' : '<span class="muted">✗</span>'}</td>
        <td style="white-space:nowrap">
          <button data-e="${u.id}">编辑</button>
          <button data-c="${u.id}">对话测试</button>
          <button data-t="${u.id}">测试</button>
          <button class="danger" data-d="${u.id}">删除</button>
        </td></tr>`).join("")}</table>`
      : `<div class="empty">还没有上游。点"新建上游"添加第一个实例:选主包、填模型与目标地址。</div>`}
    <div id="editor"></div>`;
  $("#newu").onclick = () => editUpstream(null, basePkgs, pkgs, transports);
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => editUpstream(ups.find(u => u.id == b.dataset.e), basePkgs, pkgs, transports));
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => openChatTest(ups.find(u => u.id == b.dataset.c)));
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = async () => {
    try { const r = await api.post(`/upstreams/${b.dataset.t}/test`, {}); msg(r.ok, r.ok ? `连通 ${r.latency_ms}ms` : ("失败: " + r.error)); }
    catch (err) { msg(false, err.message); }
  });
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    if (!confirm("删除该上游?")) return;
    try { await api.del(`/upstreams/${b.dataset.d}`); msg(true, "已删除"); showUpstreams(); }
    catch (err) { msg(false, err.message); }
  });
}

/* 对话测试面板:模型自由输入+datalist 提示;响应区展示状态/延迟/响应体 */
function openChatTest(u) {
  const main = $("#editor");
  const models = (u.models || []);
  main.innerHTML = `
    <div class="card" id="chatpanel">
      <h3 style="margin-top:0">对话测试 <span class="muted">${esc(u.name)}</span></h3>
      <div class="chatbox">
        <div class="row" style="margin:0">
          模型 <input id="chat-model" list="chat-models" value="${esc(models[0] || "")}" style="width:280px">
          <datalist id="chat-models">${models.map(m => `<option value="${esc(m)}">`).join("")}</datalist>
          <span class="muted">消息留空发送 "ping"</span>
        </div>
        <textarea id="chat-msg" rows="3" placeholder="输入测试消息"></textarea>
        <div class="row" style="margin:0">
          <button class="pri" id="chat-send">发送</button>
          <button id="chat-close">关闭</button>
        </div>
        <div class="out" id="chat-out">响应将显示在这里。</div>
      </div>
    </div>`;
  $("#chat-close").onclick = () => main.innerHTML = "";
  $("#chat-send").onclick = async () => {
    const model = $("#chat-model").value.trim();
    const message = $("#chat-msg").value;
    if (!model) { msg(false, "模型必填"); return; }
    const out = $("#chat-out");
    out.textContent = "请求中…";
    try {
      const r = await api.post(`/upstreams/${u.id}/chat-test`, { model, message });
      const head = `${r.ok ? "成功" : "失败"} · status ${r.status ?? "-"} · ${r.latency_ms}ms`;
      out.textContent = head + "\n\n" + (r.body ? JSON.stringify(r.body, null, 2) : (r.error || ""));
      out.style.color = r.ok ? "var(--ink)" : "var(--err)";
    } catch (err) {
      out.textContent = "请求失败: " + err.message;
      out.style.color = "var(--err)";
    }
  };
}

async function editUpstream(u, basePkgs, allPkgs, transports) {
  const isNew = !u;
  u = u || { name: "", enabled: true, base: {}, extras: [], models: [], targets: [{ enabled: true, secrets: {} }], filterParams: {}, filtersEnabled: {}, params: {} };
  const main = $("#editor");
  const filterPkgs = allPkgs.filter(p => !p.hasProtocol && (p.filters || []).length > 0);
  const trOpts = ['<option value="">direct</option>']
    .concat((transports || []).map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`)).join("");
  main.innerHTML = `
    <h3>${isNew ? "新建上游" : "编辑上游 " + esc(u.name)}</h3>
    <div class="row">
      名称 <input id="un" value="${esc(u.name)}" ${isNew ? "" : "readonly"} title="${isNew ? "" : "实例名不可改;如需改名请删除后重建"}">
      主包 <select id="ub">${basePkgs.map(p => `<option ${u.base && u.base.package === p.name ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
      启用 <input id="ue" type="checkbox" ${u.enabled ? "checked" : ""}>
    </div>
    <div class="row">模型(逗号分隔)<br><input id="um" value="${esc((u.models || []).join(","))}" style="width:420px"></div>
    <h3>目标</h3>
    <table id="ut"><tr><th>名称</th><th>BaseURL</th><th>传输</th><th>api_key</th><th>权重</th><th>启用</th></tr></table>
    <button id="addt">+ 目标</button>
    <h3>附加包(filters)</h3>
    <div class="row">添加
      <select id="exsel">${filterPkgs.map(p => `<option>${esc(p.name)}</option>`).join("") || "<option value=''>无可选 filters 包</option>"}</select>
      <button id="addex">+ 附加包</button>
    </div>
    <table id="ext"><tr><th>包</th><th>filter</th><th>启用</th><th>参数(JSON)</th><th></th></tr></table>
    <div class="row"><button class="pri" id="saveu">保存</button> <button id="cancelu">取消</button></div>`;
  const tb = $("#ut");
  const addRow = t => {
    const tr = document.createElement("tr");
    if (t && t.name) tr.dataset.prev = t.name; // 行对应旧目标名(改名迁移凭据用)
    tr.innerHTML = `<td><input class="tn" value="${esc(t.name || "")}"></td>
      <td><input class="tb" value="${esc(t.base_url || "")}" style="width:280px"></td>
      <td><select class="tt">${trOpts}</select></td>
      <td><input class="ts" type="password" value="${esc((t.secrets && t.secrets.api_key) || "")}" placeholder="留空保留旧值"></td>
      <td><input class="tw num" type="number" min="1" value="${t.weight > 0 ? t.weight : 1}" style="width:70px" title="加权随机权重"></td>
      <td><input class="te" type="checkbox" ${t.enabled !== false ? "checked" : ""}></td>`;
    tr.querySelector(".tt").value = t.transport || "";
    tb.appendChild(tr);
  };
  (u.targets || []).forEach(addRow);
  $("#addt").onclick = () => addRow({});
  const ext = $("#ext");
  const paramsOf = key => (u.filterParams && u.filterParams[key]) || {};
  const addExRow = (pkgName, filterName, on) => {
    const key = pkgName + "/" + filterName;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(pkgName)}</td><td>${esc(filterName)}</td>
      <td><input class="xe" type="checkbox" ${on ? "checked" : ""}></td>
      <td><input class="xp" style="width:280px" placeholder='{"model":"..."}' value='${esc(JSON.stringify(paramsOf(key)))}'></td>
      <td><button class="danger">移除</button></td>`;
    tr.querySelector("button").onclick = () => tr.remove();
    ext.appendChild(tr);
  };
  for (const ex of u.extras || []) {
    const pkg = allPkgs.find(p => p.name === ex.package);
    for (const fn of (pkg && pkg.filters) || []) {
      const key = ex.package + "/" + fn;
      addExRow(ex.package, fn, u.filtersEnabled ? u.filtersEnabled[key] !== false : true);
    }
  }
  $("#addex").onclick = () => {
    const pkgName = $("#exsel").value;
    if (!pkgName) return;
    const pkg = allPkgs.find(p => p.name === pkgName);
    for (const fn of (pkg && pkg.filters) || []) addExRow(pkgName, fn, true);
  };
  $("#cancelu").onclick = () => main.innerHTML = "";
  $("#saveu").onclick = async () => {
    const targets = [...tb.querySelectorAll("tr")].slice(1).map(tr => {
      const key = tr.querySelector(".ts").value;
      const name = tr.querySelector(".tn").value;
      const renamed = !isNew && tr.dataset.prev && tr.dataset.prev !== name;
      return {
        name,
        base_url: tr.querySelector(".tb").value,
        transport: tr.querySelector(".tt").value,
        enabled: tr.querySelector(".te").checked,
        weight: Math.max(1, parseInt(tr.querySelector(".tw").value, 10) || 1),
        // 编辑态留空 = 保留旧凭据,按后端契约发掩码;改名行附原名供迁移
        secrets: { api_key: !isNew && !key ? "***" : key },
        ...(renamed ? { rename_from: tr.dataset.prev } : {}),
      };
    });
    const extras = [], filtersEnabled = {}, filterParams = {};
    const seen = new Set();
    for (const tr of [...ext.querySelectorAll("tr")].slice(1)) {
      const cells = tr.querySelectorAll("td");
      const pkgName = cells[0].textContent, filterName = cells[1].textContent;
      const key = pkgName + "/" + filterName;
      if (!seen.has(pkgName)) { extras.push({ package: pkgName }); seen.add(pkgName); }
      filtersEnabled[key] = tr.querySelector(".xe").checked;
      try { filterParams[key] = JSON.parse(tr.querySelector(".xp").value || "{}"); }
      catch (e) { msg(false, `参数 JSON 非法: ${key}`); return; }
    }
    const body = {
      id: u.id || 0, name: $("#un").value, enabled: $("#ue").checked,
      base: { package: $("#ub").value }, extras,
      models: $("#um").value.split(",").map(s => s.trim()).filter(Boolean),
      targets, params: u.params || {}, filterParams, filtersEnabled,
    };
    try {
      await api.call(isNew ? "POST" : "PUT", isNew ? "/upstreams" : `/upstreams/${u.id}`, body);
      msg(true, "已保存"); main.innerHTML = ""; showUpstreams();
    } catch (err) { msg(false, err.message); }
  };
}

/* 导入(摘要确认;含元数据) */
function bindImport() {
  $("#ip").onclick = () => $("#fp").click();
  const confirmSummary = async s => {
    const lines = [
      `包名: ${s.title || s.name}${s.title ? "(" + s.name + ")" : ""}`, `版本: ${s.installedVersion ? s.version + " (已装 " + s.installedVersion + ",将升级)" : s.version}`,
      s.description ? `描述: ${s.description}` : "",
      `协议: ${s.protocol || "-"}`, `形态: ${(s.form || []).join(",") || "-"}`,
      `能力: ${(s.features || []).join(",") || "-"}`,
      `filters: ${(s.filters || []).join(",") || "无"}`,
      `secretRefs: ${(s.secretRefs || []).join(",") || "无"}`,
      `hooks 任务: ${s.hooks ? (s.hooks.tasks || []).map(t => t.name || t).join(",") || "无任务" : "无"}`,
    ].filter(Boolean);
    return confirm("导入确认\n" + lines.join("\n") + "\n\n确认安装?");
  };
  $("#fp").onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    const bytes = new Uint8Array(await f.arrayBuffer());
    try {
      const s = await api.call("POST", "/packages/inspect", undefined, false, bytes);
      if (!(await confirmSummary(s))) return;
      const r = await fetch("/admin/api/packages", { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: bytes });
      if (!r.ok) throw new Error((await r.json()).error || "HTTP " + r.status);
      msg(true, "已安装"); showPackages();
    } catch (err) { msg(false, err.message); }
    e.target.value = "";
  };
  $("#iu").onclick = async () => {
    const url = prompt("包 URL (.aap):");
    if (!url) return;
    try {
      const s = await api.post("/packages/inspect", { url });
      if (!(await confirmSummary(s))) return;
      await api.post("/packages/import-url", { url });
      msg(true, "已安装"); showPackages();
    } catch (err) { msg(false, err.message); }
  };
}

    <div class="tabpane" id="pane-code"></div>
    <div class="tabpane" id="pane-mon"></div>`;
  $("#pd-toggle").onclick = async () => {

  };

  const loaded = {};

/* 配置与任务两 pane 共享一次 settings 加载(version 乐观锁同源) */
async function loadSettingsPanes(name, loaded) {
  const state = plugConfState;
  state.settings = null;
  const cfgPane = $("#pane-config"), taskPane = $("#pane-tasks");
  let s = null;
  try { s = await api.get(`/packages/${name}/settings`); }
  catch (err) {
    // 无 hooks 包:settings API 拒绝 → 置灰提示;其余错误如实呈现(可重试)
    if (!/no settings|no hooks/i.test(err.message)) throw err;
    state.settings = { noHooks: true, version: 0, config: [], tasks: [] };
    cfgPane.innerHTML = `<div class="muted">此包未声明配置项(无 hooks 部件)。</div>`;
    taskPane.innerHTML = `<div class="muted">此包无定时任务(无 hooks 部件)。</div>`;
    loaded.tasks = true;
    return;
  }
  state.settings = { version: s.version, config: s.config || [], tasks: s.tasks || [], noHooks: false };
  renderConfigPane(name);
  renderTasksPane(name);
  loaded.tasks = true;
}

function renderConfigPane(name) {
  const st = plugConfState.settings;
  $("#pane-config").innerHTML = `
    ${(st.config || []).map(slot => {
      const sch = slot.schema || {};
      const label = `<label>${esc(sch.description || slot.name)} <span style="font-size:11px">${esc(slot.name)}${slot.overridden ? " · 已覆盖" : ""}</span></label>`;
      const v = slot.value === undefined || slot.value === null ? "" : slot.value;
      if (sch.type === "bool") return `<div class="slot">${label}<input type="checkbox" data-s="${esc(slot.name)}" ${slot.value ? "checked" : ""}></div>`;
      if (sch.type === "enum") return `<div class="slot">${label}<select data-s="${esc(slot.name)}">${(sch.values || []).map(x => `<option ${x === slot.value ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>`;
      const typ = sch.type === "int" || sch.type === "number" ? "number" : "text";
      return `<div class="slot">${label}<input type="${typ}" data-s="${esc(slot.name)}" value="${esc(v)}"></div>`;
    }).join("") || `<div class="muted">此包未声明配置项</div>`}
    <div class="row"><button class="pri" id="cfgsave">保存配置</button> <span class="muted" id="cfgver">version ${st.version}</span></div>`;
  $("#cfgsave").onclick = () => saveSettings(name, "config");
}

function renderTasksPane(name) {
  const st = plugConfState.settings;
  $("#pane-tasks").innerHTML = `
    ${(st.tasks || []).map(t => `
      <div class="row" data-task="${esc(t.name)}">
        <b>${esc(t.name)}</b>
        ${t.next ? `<span class="muted">自调度(next 链)</span>` : `<input data-tcron="${esc(t.name)}" value="${esc(t.cron || "")}" style="width:150px" placeholder="cron 表达式">`}
        <label class="muted" style="font-size:12px">启用 <input type="checkbox" data-tdis="${esc(t.name)}" ${t.enabled === false ? "" : "checked"}></label>
        ${t.overridden ? `<span class="muted" style="font-size:11px">已覆盖</span>` : ""}
      </div>`).join("") || `<div class="muted">此包无定时任务</div>`}
    <div class="row"><button class="pri" id="tasksave">保存任务改动</button></div>`;
  $("#tasksave").onclick = () => saveSettings(name, "tasks");
}

/* 配置/任务保存:后端 PUT 是全量覆盖语义,保存时必须双收集(两 pane 常驻 DOM),只传单边会清空另一侧覆盖;409 自动刷新重试 */
async function saveSettings(name, which) {
  const st = plugConfState.settings;
  if (!st || st.noHooks) return;
  const config = {};
  document.querySelectorAll("#pane-config [data-s]").forEach(inp => {
    if (inp.type === "checkbox") config[inp.dataset.s] = inp.checked;
    else if (inp.type === "number") config[inp.dataset.s] = Number(inp.value);
    else config[inp.dataset.s] = inp.value;
  });
  const tasks = {};
  document.querySelectorAll("#pane-tasks [data-task]").forEach(row => {
    const tn = row.dataset.task;
    const cronInp = row.querySelector("[data-tcron]");
    const enInp = row.querySelector("[data-tdis]");
    const ov = {};
    if (cronInp && cronInp.value) ov.cron = cronInp.value;
    if (enInp && !enInp.checked) ov.disabled = true;
    if (Object.keys(ov).length) tasks[tn] = ov;
  });
  try {
    const r = await api.put(`/packages/${name}/settings`, { config, tasks, version: st.version });
    msg(true, which === "config" ? "配置已保存" : "任务已保存");
    plugConfState.settings.version = r.version;
    const ver = $("#cfgver"); if (ver) ver.textContent = `version ${r.version}`;
  } catch (err) {
    if (String(err.message).includes("version mismatch")) {
      // 乐观锁过期:自动刷新缓存与表单,提示重试
      msg(false, "配置已被其他修改更新,已刷新,请重试");
      const loaded = { keys: true, code: true, mon: true, config: false, tasks: false };
      await loadSettingsPanes(name, loaded);
      document.querySelectorAll(".tabs a").forEach(x => x.classList.toggle("on", x.dataset.tab === which));
      document.querySelectorAll(".tabpane").forEach(x => x.classList.toggle("on", x.id === "pane-" + which));
      return;
    }
    msg(false, err.message);
  }
}

/* keys pane:keyForm 表单(推荐入口)+ 手动新增 + 逐键行 + 轮转视图 */
async function renderKeysPane(name) {
  $("#pane-keys").innerHTML = `
    <div id="keyformbox" style="display:none">
      <div id="keyformfields"></div>
      <div class="row" id="keyformactions"></div>
      <button class="pri" id="keyformsubmit">提交</button>
    </div>
    <div id="keymanual" style="display:none">
      <div class="row"><input id="newkeyname" style="width:160px" placeholder="键名(已预填)"><textarea id="newkeyval" rows="2" placeholder='值(JSON,如 "str" 或 {"k":1})' style="width:340px"></textarea><button class="pri" id="addkey">添加</button></div>
    </div>
    <div id="keyrows"></div>
    <pre class="log" id="keyspre"></pre>`;
  try {
    const kv = await api.get(`/packages/${name}/keys`);
    const hooks = kv.hooks || {};
    $("#keyspre").textContent = JSON.stringify({ current: kv.current, previous: kv.previous }, null, 2);
    renderKeyRows(name, kv, hooks);
    if (hooks.keyForm) {
      try { await renderKeyForm(name); $("#keymanual").style.display = "block"; }
      catch (e) { $("#keymanual").style.display = "block"; prefillNewKey(kv); }
    } else {
      $("#keymanual").style.display = "block";
      prefillNewKey(kv);
    }
    $("#addkey").onclick = () => addKey(name, kv);
  } catch (err) { msg(false, err.message); }
}

function renderKeyRows(name, kv, hooks) {
  const rows = Object.keys(kv.current || {}).map(k => `
    <div class="row" data-krow="${esc(k)}">
      <b>${esc(k)}</b>
      <span class="muted" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(kv.current[k]).slice(0, 60))}</span>
      ${hooks.keyWrite ? `<button data-kedit="${esc(k)}">编辑</button>` : ""}
      ${hooks.keyRead ? `<button data-kdetail="${esc(k)}">详情</button>` : ""}
    </div>`).join("");
  $("#keyrows").innerHTML = rows || `<div class="muted">暂无 key</div>`;
  document.querySelectorAll("[data-kedit]").forEach(b => b.onclick = () => editKey(name, kv, b.dataset.kedit));
  document.querySelectorAll("[data-kdetail]").forEach(b => b.onclick = async () => {
    try {
      const d = await api.get(`/packages/${name}/keys/${encodeURIComponent(b.dataset.kdetail)}/detail`);
      $("#keyspre").textContent = JSON.stringify(d.detail, null, 2);
    } catch (err) { msg(false, err.message); }
  });
}

function editKey(name, kv, key) {
  const cur = kv.current[key];
  const v = prompt(`编辑 ${key}(JSON):`, JSON.stringify(cur, null, 2));
  if (v === null) return;
  let val;
  try { val = JSON.parse(v); } catch { msg(false, "值不是合法 JSON"); return; }
  const updatedAt = Number(kv.updatedAt || 0);
  api.put(`/packages/${name}/keys/${encodeURIComponent(key)}`, { value: val, baseUpdatedAt: updatedAt })
    .then(() => renderKeysPane(name))
    .catch(err => msg(false, err.message));
}

function addKey(name, kv) {
  const key = $("#newkeyname").value.trim();
  if (!key) { msg(false, "键名必填"); return; }
  let val;
  try { val = JSON.parse($("#newkeyval").value || "null"); } catch { msg(false, "值不是合法 JSON"); return; }
  api.put(`/packages/${name}/keys/${encodeURIComponent(key)}`, { value: val, baseUpdatedAt: Number(kv.updatedAt || 0) })
    .then(() => renderKeysPane(name))
    .catch(err => msg(false, err.message));
}

/* 键名预填:无 keySchema 数据面时按 key-N 兜底 */
function prefillNewKey(kv) {
  const existing = new Set(Object.keys(kv.current || {}));
  let i = 1;
  while (existing.has(`key-${i}`)) i++;
  $("#newkeyname").value = `key-${i}`;
  $("#newkeyval").value = "";
}

/* keyForm 采集表单(推荐入口):fields 渲染 + actions 按钮 + 提交(errors 字段级标红) */
async function renderKeyForm(name) {
  const f = await api.post(`/packages/${name}/keys/form`, {});
  $("#keyformbox").style.display = "block";
  $("#keyformfields").innerHTML = (f.fields || []).map((slot, i) => {

        return;

  };

/* ─── 请求历史:时间段 + 分页 + 过滤 + 单条详情(bodies;状态色按 4xx/5xx 分级) ─── */
const histState = { limit: 50, offset: 0 };
const histStatusColor = s => s >= 500 ? "color:var(--err)" : (s >= 400 ? "color:var(--warn)" : "");
/* 预设时间窗(ms 相对 now,0 = 全部,-1 = 自定义输入) */
const HIST_RANGES = [
  { label: "全部", ms: 0 },
  { label: "30分钟", ms: 30*60*1000 },
  { label: "1小时", ms: 60*60*1000 },
  { label: "6小时", ms: 6*60*60*1000 },
  { label: "1天", ms: 24*60*60*1000 },
  { label: "7天", ms: 7*24*60*60*1000 },
  { label: "30天", ms: 30*24*60*60*1000 },
  { label: "自定义", ms: -1 },
];

async function showHistory() {
  $("#main").innerHTML = `
    <div class="titlerow"><h2>请求历史</h2><button id="histrf">刷新</button></div>
    <div class="row">
      时间 <select id="his-range">${HIST_RANGES.map(r => `<option value="${r.ms}">${r.label}</option>`).join("")}</select>
      <span id="his-custom" style="display:none">
        <input type="datetime-local" id="his-start" style="width:200px"> 至
        <input type="datetime-local" id="his-end" style="width:200px">
      </span>
      模型 <input id="his-model" style="width:140px">
      上游 <input id="his-upstream" style="width:120px">
      <label class="muted" style="font-size:13px">仅错误 <input id="his-err" type="checkbox"></label>
      <button class="pri" id="his-q">查询</button>
      <span class="muted" id="his-total"></span>

    <div id="his-table"><div class="muted">载入中…</div></div>
    <div id="his-detail"></div>`;
  $("#histrf").onclick = showHistory;
  $("#his-range").onchange = e => { toggleHistCustom(+e.target.value); histState.offset = 0; loadHistory(); };
  $("#his-q").onclick = () => { histState.offset = 0; loadHistory(); };
  toggleHistCustom(+$("#his-range").value);
  loadHistory();
}

function toggleHistCustom(ms) { $("#his-custom").style.display = ms < 0 ? "" : "none"; }

/* 当前时间窗的 start/end(epoch ms);无过滤返回 {} */
function histTimeRange() {
  const ms = +$("#his-range").value;
  if (ms > 0) return { start: Date.now() - ms };
  if (ms < 0) {
    const out = {};
    const s = $("#his-start").value, e = $("#his-end").value;
    if (s && Number.isFinite(+new Date(s))) out.start = new Date(s).getTime();
    if (e && Number.isFinite(+new Date(e))) out.end = new Date(e).getTime();
    return out;
  }
  return {};
}

async function loadHistory() {
  const q = new URLSearchParams({ limit: histState.limit, offset: histState.offset });
  const model = $("#his-model").value.trim(), upstream = $("#his-upstream").value.trim();
  if (model) q.set("model", model);
  if (upstream) q.set("upstream", upstream);
  if ($("#his-err").checked) q.set("error", "1");
  const range = histTimeRange();
  if (range.start) q.set("start", range.start);
  if (range.end) q.set("end", range.end);
  let r;
  try { r = await api.get("/history?" + q); }
  catch (err) { $("#his-table").innerHTML = `<div class="empty">加载失败: ${esc(err.message)}</div>`; return; }
  const items = r.items || [];
  $("#his-total").textContent = `共 ${fmt(r.total)} 条`;
  $("#his-table").innerHTML = items.length ? `<table>
    <tr><th>时间</th><th>模型</th><th>上游</th><th>目标</th><th>状态</th><th>耗时</th><th>路径</th></tr>
    ${items.map(e => `<tr data-id="${e.id}" style="cursor:pointer">
      <td class="num">${new Date(e.ts).toLocaleString()}</td>
      <td>${esc(e.model)}</td><td>${esc(e.upstream)}</td><td>${esc(e.target || "—")}</td>
      <td class="num" style="${histStatusColor(e.status)}">${e.status}</td>
      <td class="num">${fmt(e.duration_ms)}ms</td>
      <td>${esc(e.path)}${e.stream ? ' <span class="badge">流</span>' : ""}</td>
    </tr>`).join("")}</table>${histPagerHTML(r)}` : `<div class="empty">暂无请求历史</div>`;
  document.querySelectorAll("#his-table tr[data-id]").forEach(tr => tr.onclick = () => openHistoryDetail(tr.dataset.id));
  const prev = $("#his-prev"), next = $("#his-next");
  if (prev) prev.onclick = () => { histState.offset = Math.max(0, histState.offset - histState.limit); loadHistory(); };
  if (next) next.onclick = () => { histState.offset += histState.limit; loadHistory(); };
}

function histPagerHTML(r) {
  if (r.total <= histState.limit) return "";
  const page = Math.floor(histState.offset / histState.limit);
  const pages = Math.ceil(r.total / histState.limit);
  return `<div class="row">
    <button id="his-prev" ${page === 0 ? "disabled" : ""}>上一页</button>
    <span class="muted">第 ${page + 1} / ${pages} 页</span>
    <button id="his-next" ${(page + 1) * histState.limit >= r.total ? "disabled" : ""}>下一页</button>
  </div>`;
}

/* aggregateDim 时序维度聚合:键 → {requests, errors, maxConc} */
function aggregateDim(series, field) {
  const out = {};
  series.forEach(row => {
    const dim = row[field] || {};
    Object.entries(dim).forEach(([k, c]) => {
      const o = out[k] || (out[k] = { requests: 0, errors: 0, maxConc: 0 });
      o.requests += c.requests || 0;
      o.errors += c.errors || 0;
      o.maxConc = Math.max(o.maxConc, c.max_concurrent || 0);
    });
  });
  return out;
}

/* renderDimTable 维度表:请求数/错误数/错误率(/并发峰值);JSON dump 的替代 */
function renderDimTable(holder, dim, withConc) {
  const keys = Object.keys(dim).sort((a, b) => dim[b].requests - dim[a].requests);
  const box = $("#" + holder);
  if (!keys.length) { box.innerHTML = `<div class="empty">暂无数据</div>`; return; }
  box.innerHTML = `<table>
    <tr><th>键</th><th>请求数</th><th>错误数</th><th>错误率</th>${withConc ? "<th>并发峰值</th>" : ""}</tr>
    ${keys.map(k => {
      const c = dim[k];
      const rate = c.requests > 0 ? (c.errors * 100 / c.requests).toFixed(1) + "%" : "—";
      const rateCls = c.requests > 0 && c.errors > 0 ? "err" : "";
      return `<tr><td>${esc(k)}</td>
        <td class="num">${fmt(c.requests)}</td>
        <td class="num">${fmt(c.errors)}</td>
        <td class="num ${rateCls}" style="${rateCls ? "color:var(--err)" : ""}">${rate}</td>
        ${withConc ? `<td class="num">${fmt(c.maxConc)}</td>` : ""}</tr>`;
    }).join("")}</table>`;
}

/* drawSpark 迷你走势(canvas 用色读主题变量,主题切换经 registerDraw 重绘) */
function drawSpark(id, values, warnColor) {
  const cv = document.getElementById(id);
  if (!cv) return;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = cssVar("--line-soft");
  ctx.strokeRect(0.5, 0.5, cv.width - 1, cv.height - 1);
  if (!values || values.length < 2) {
    ctx.fillStyle = cssVar("--faint"); ctx.font = "11px system-ui";
    ctx.fillText("暂无走势", 12, 30);
    return;
  }
  const maxV = Math.max(1, ...values), pad = 4;
  const x = i => pad + (cv.width - 2 * pad) * i / (values.length - 1);
  const y = v => cv.height - pad - (cv.height - 2 * pad) * (v / maxV);
  const lineColor = warnColor ? cssVar("--warn") : cssVar("--acc");
  ctx.beginPath();
  ctx.moveTo(x(0), cv.height - pad);
  values.forEach((v, i) => ctx.lineTo(x(i), y(v)));
  ctx.lineTo(x(values.length - 1), cv.height - pad);
  ctx.closePath();
  ctx.fillStyle = cssVar("--acc-weak");
  if (warnColor) ctx.fillStyle = cssVar("--warn") + "1a"; // 主题色 + 10% alpha(hex 1a)
  ctx.fill();
  ctx.beginPath();
  values.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
  ctx.strokeStyle = lineColor; ctx.lineWidth = 1.6; ctx.stroke();
}

/* drawChart 主时序:requests 面积 + errors 线(目标 canvas id,监控页与包监控 pane 复用) */
function drawChart(id, series) {
  const cv = document.getElementById(id);
  if (!cv) return;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!series || !series.length) {
    ctx.fillStyle = cssVar("--faint"); ctx.font = "13px system-ui";
    ctx.fillText("暂无时序数据(每分钟落一次库;有流量后这里会出现分钟曲线)", 20, 44);
    return;
  }
  const W = cv.width, H = cv.height, pad = 34, padR = 16;
  const maxV = Math.max(1, ...series.map(p => Math.max(p.requests, p.errors)));
  // 刻度取整:小数值域用 0.5 步长避免重复整数刻度
  const step = maxV < 4 ? 0.5 : Math.ceil(maxV / 4);
  const x = i => pad + (W - pad - padR) * (series.length === 1 ? 0.5 : i / (series.length - 1));
  const y = v => H - pad - (H - pad - 14) * (v / maxV);
  ctx.strokeStyle = cssVar("--line-soft");
  for (let g = 0; g * step <= maxV; g++) {
    const gy = y(g * step);
    ctx.beginPath(); ctx.moveTo(pad, gy); ctx.lineTo(W - padR, gy); ctx.stroke();
    ctx.fillStyle = cssVar("--faint"); ctx.font = "11px ui-monospace";
    ctx.fillText(String(g * step), 6, gy + 4);
  }
  const accColor = cssVar("--acc"), errColor = cssVar("--err");
  ctx.beginPath();
  ctx.moveTo(x(0), y(0));
  series.forEach((p, i) => ctx.lineTo(x(i), y(p.requests)));
  ctx.lineTo(x(series.length - 1), y(0));
  ctx.closePath();
  ctx.fillStyle = cssVar("--acc-weak");
  ctx.fill();
  const line = (key, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 1.6;
    ctx.beginPath();
    series.forEach((p, i) => i ? ctx.lineTo(x(i), y(p[key])) : ctx.moveTo(x(i), y(p[key])));
    ctx.stroke();
  };
  line("requests", accColor);
  line("errors", errColor);
  ctx.fillStyle = cssVar("--faint"); ctx.font = "11px ui-monospace";
  ctx.fillText(series[0].minute, pad, H - 6);
  const last = series[series.length - 1].minute;
  ctx.fillText(last, W - padR - ctx.measureText(last).width, H - 6);
}

// 入口:已登录态探测(首访主题随系统)
document.documentElement.dataset.theme = initialTheme;
(async () => {
  try { await api.get("/me"); show("ups"); } catch (e) { show("login"); }
})();
