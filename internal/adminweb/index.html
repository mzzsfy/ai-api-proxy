<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-api-proxy 控制台</title>
<style>
  :root {
    --bg0:#0C1310; --bg1:#111A16; --bg2:#16211C; --line:#24322B; --line-soft:#1B2721;
    --ink:#E8EFE9; --dim:#8FA398; --faint:#5C6F64;
    --acc:#4FD6B8; --warn:#E8B44A; --err:#F26D5B;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg0); color:var(--ink); min-height:100vh;
  }
  a { color:var(--acc); text-decoration:none; }
  a:hover { text-decoration:underline; }
  h2 { font-size:19px; font-weight:650; letter-spacing:-0.01em; margin:2px 0 18px; }
  h3 { font-size:14px; font-weight:650; margin:26px 0 10px; }
  table { border-collapse:collapse; width:100%; margin:10px 0; font-size:13px; }
  th { text-align:left; font-weight:600; color:var(--dim); font-size:12px; padding:6px 10px;
       border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:7px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  tr:hover td { background:var(--bg1); }
  input,textarea,select {
    font:inherit; color:var(--ink); background:var(--bg2);
    border:1px solid var(--line); border-radius:6px; padding:5px 9px;
  }
  input:focus,textarea:focus,select:focus { outline:none; border-color:var(--acc); }
  input[type=checkbox] { accent-color:var(--acc); }
  textarea { font-family:var(--mono); font-size:12.5px; width:100%; line-height:1.6; }
  button {
    font:inherit; color:var(--ink); background:var(--bg2);
    border:1px solid var(--line); border-radius:6px; padding:5px 14px; cursor:pointer;
  }
  button:hover { border-color:var(--dim); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
  button.pri { background:var(--acc); border-color:var(--acc); color:#08221B; font-weight:600; }
  button.pri:hover { background:#63DFC4; }
  button.danger { color:var(--err); }
  button.danger:hover { border-color:var(--err); }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .muted { color:var(--dim); font-size:12px; }
  .row { margin:12px 0; }
  pre.log {
    font-family:var(--mono); font-size:12px; line-height:1.6; white-space:pre-wrap;
    background:var(--bg1); border:1px solid var(--line-soft); border-radius:8px;
    padding:12px 14px; max-height:320px; overflow:auto; color:#B9CCC0;
  }
  /* 布局:左栏导航 + 主区 */
  .shell { display:flex; min-height:100vh; }
  nav {
    width:172px; flex:none; padding:20px 14px; background:var(--bg1);
    border-right:1px solid var(--line-soft); display:flex; flex-direction:column; gap:2px;
  }
  .brand { font-weight:700; font-size:14px; letter-spacing:-0.01em; padding:0 10px 18px; }
  .brand i { font-style:normal; color:var(--acc); }
  nav a { display:block; padding:7px 10px; border-radius:6px; color:var(--dim); cursor:pointer; }
  nav a:hover { color:var(--ink); background:var(--bg2); text-decoration:none; }
  nav a.on { color:var(--ink); background:var(--bg2); box-shadow:inset 2px 0 0 var(--acc); }
  nav .gap { flex:1; }
  #logout { color:var(--err); margin-top:18px; }
  main { flex:1; padding:26px 32px 48px; max-width:1140px; }
  @media (max-width:680px) {
    .shell { flex-direction:column; }
    nav { width:auto; flex-direction:row; align-items:center; padding:10px 14px; }
    .brand { padding:0 10px; } nav .gap { flex:1; } #logout { margin:0; }
    main { padding:18px 16px 40px; }
  }
  /* 登录 */
  .gate { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .gate .panel { width:320px; background:var(--bg1); border:1px solid var(--line-soft); border-radius:10px; padding:30px 28px 26px; }
  .gate h2 { margin-bottom:20px; }
  .gate label { display:block; color:var(--dim); font-size:12px; margin:14px 0 5px; }
  .gate input { width:100%; }
  .gate button { width:100%; margin-top:20px; padding:8px; }
  /* 提示条 */
  #msg {
    position:fixed; top:14px; right:14px; z-index:9; padding:9px 16px; border-radius:8px;
    display:none; color:#fff; font-size:13px; max-width:60vw;
  }
  /* 监控:脉搏带(记忆点)+ 指标行 */
  .pulse { display:flex; align-items:flex-end; gap:28px; flex-wrap:wrap;
           border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:6px; }
  .pulse .big .v { font-family:var(--mono); font-variant-numeric:tabular-nums;
                   font-size:52px; line-height:1; font-weight:600; letter-spacing:-0.02em; color:var(--acc); }
  .pulse .big .l { color:var(--dim); font-size:12.5px; margin-top:8px; }
  .pulse .big .l b { color:var(--ink); font-weight:600; }
  .pulse canvas { margin-bottom:6px; }
  .stats { display:flex; gap:34px; flex-wrap:wrap; margin:18px 0 4px; }
  .stat .v { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:24px; font-weight:600; }
  .stat .v.warn { color:var(--warn); } .stat .v.err { color:var(--err); } .stat .v.acc { color:var(--acc); }
  .stat .l { color:var(--dim); font-size:12px; margin-top:3px; }
  .empty { color:var(--faint); padding:26px 0; text-align:center; }
  .titlerow { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .titlerow h2 { margin-bottom:8px; }
</style>
</head>
<body>
<div id="msg"></div>
<div id="app"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>\"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => new Intl.NumberFormat("en-US").format(n);

const api = {
  async call(method, path, body, raw, rawBytes) {
    const opt = { method, headers: {} };
    if (rawBytes !== undefined) {
      opt.body = rawBytes;
      opt.headers["Content-Type"] = "application/octet-stream";
    } else if (body !== undefined) {
      opt.body = typeof body === "string" ? body : JSON.stringify(body);
      opt.headers["Content-Type"] = "application/json";
    }
    const r = await fetch("/admin/api" + path, opt);
    if (r.status === 401) { show("login"); throw new Error("登录已过期"); }
    const data = raw ? await r.text() : await r.json();
    if (!r.ok) throw new Error(data.error || data.message || ("HTTP " + r.status));
    return data;
  },
  get: (p, raw) => api.call("GET", p, undefined, raw),
  post: (p, b) => api.call("POST", p, b),
  put: (p, b) => api.call("PUT", p, b),
  del: p => api.call("DELETE", p),
};
function msg(ok, text) {
  const el = $("#msg");
  el.style.background = ok ? "var(--acc)" : "var(--err)";
  el.style.color = ok ? "#08221B" : "#fff";
  el.textContent = text; el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", 3200);
}

/* ─── 外壳与路由 ─── */
const PAGES = { ups: showUpstreams, pkgs: showPackages, mon: showMonitor };
const PAGE_NAMES = { ups: "上游", pkgs: "包", mon: "监控" };
function shell(page, mainHTML) {
  $("#app").innerHTML = `
    <div class="shell">
      <nav>
        <div class="brand">ai-api-proxy<i>_</i>控制台</div>
        <a data-p="ups">上游</a><a data-p="pkgs">包</a><a data-p="mon">监控</a>
        <div class="gap"></div>
        <a id="logout">退出</a>
      </nav>
      <main id="main">${mainHTML}</main>
    </div>`;
  document.querySelectorAll("nav a[data-p]").forEach(a => {
    a.classList.toggle("on", a.dataset.p === page);
    a.onclick = () => show(a.dataset.p);
  });
  $("#logout").onclick = async () => {
    try { await api.post("/logout", {}); } catch (e) {}
    sessionStorage.removeItem("in"); show("login");
  };
}
function show(page) {
  if (page === "login") {
    $("#app").innerHTML = `
      <div class="gate"><div class="panel">
        <h2>控制台登录</h2>
        <form id="lf">
          <label for="u">用户名</label>
          <input id="u" value="admin" autocomplete="username">
          <label for="p">口令</label>
          <input id="p" type="password" autocomplete="current-password">
          <button class="pri">登录</button>
        </form>
      </div></div>`;
    $("#lf").onsubmit = async e => {
      e.preventDefault();
      try {
        await api.post("/login", { user: $("#u").value, password: $("#p").value });
        sessionStorage.setItem("in", "1"); show("ups");
      } catch (err) { msg(false, err.message); }
    };
    return;
  }
  shell(page, `<h2>${PAGE_NAMES[page]}</h2><div class="muted">载入中…</div>`);
  PAGES[page]();
}

/* ─── 上游 ─── */
async function showUpstreams() {
  const [ups, pkgs, transports] = await Promise.all([api.get("/upstreams"), api.get("/packages"), api.get("/transports")]);
  const basePkgs = pkgs.filter(p => p.hasProtocol);
  $("#main").innerHTML = `
    <h2>上游</h2>
    <div class="row"><button class="pri" id="newu">新建上游</button></div>
    ${ups.length ? `<table>
      <tr><th>ID</th><th>名称</th><th>主包</th><th>附加</th><th>模型</th><th>目标</th><th>启用</th><th></th></tr>
      ${ups.map(u => `<tr>
        <td class="num">${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.base.package)}</td>
        <td>${(u.extras || []).map(e => esc(e.package)).join(",") || '<span class="muted">—</span>'}</td>
        <td>${esc((u.models || []).join(","))}</td>
        <td>${(u.targets || []).map(t => esc(t.name) + (t.enabled === false ? '<span class="muted">(停)</span>' : "")).join("<br>")}</td>
        <td>${u.enabled ? '<span style="color:var(--acc)">✓</span>' : '<span class="muted">✗</span>'}</td>
        <td style="white-space:nowrap">
          <button data-e="${u.id}">编辑</button>
          <button data-t="${u.id}">测试</button>
          <button class="danger" data-d="${u.id}">删除</button>
        </td></tr>`).join("")}</table>`
      : `<div class="empty">还没有上游。点"新建上游"添加第一个实例:选主包、填模型与目标地址。</div>`}
    <div id="editor"></div>`;
  $("#newu").onclick = () => editUpstream(null, basePkgs, pkgs, transports);
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => editUpstream(ups.find(u => u.id == b.dataset.e), basePkgs, pkgs, transports));
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = async () => {
    try { const r = await api.post(`/upstreams/${b.dataset.t}/test`, {}); msg(r.ok, r.ok ? `连通 ${r.latency_ms}ms` : ("失败: " + r.error)); }
    catch (err) { msg(false, err.message); }
  });
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    if (!confirm("删除该上游?")) return;
    try { await api.del(`/upstreams/${b.dataset.d}`); msg(true, "已删除"); showUpstreams(); }
    catch (err) { msg(false, err.message); }
  });
}

async function editUpstream(u, basePkgs, allPkgs, transports) {
  const isNew = !u;
  u = u || { name: "", enabled: true, base: {}, extras: [], models: [], targets: [{ enabled: true, secrets: {} }], filterParams: {}, filtersEnabled: {}, params: {} };
  const main = $("#editor");
  const filterPkgs = allPkgs.filter(p => !p.hasProtocol && (p.filters || []).length > 0);
  const trOpts = ['<option value="">direct</option>']
    .concat((transports || []).map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`)).join("");
  main.innerHTML = `
    <h3>${isNew ? "新建上游" : "编辑上游 " + esc(u.name)}</h3>
    <div class="row">
      名称 <input id="un" value="${esc(u.name)}">
      主包 <select id="ub">${basePkgs.map(p => `<option ${u.base && u.base.package === p.name ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
      启用 <input id="ue" type="checkbox" ${u.enabled ? "checked" : ""}>
    </div>
    <div class="row">模型(逗号分隔)<br><input id="um" value="${esc((u.models || []).join(","))}" style="width:420px"></div>
    <h3>目标</h3>
    <table id="ut"><tr><th>名称</th><th>BaseURL</th><th>传输</th><th>api_key</th><th>权重</th><th>启用</th></tr></table>
    <button id="addt">+ 目标</button>
    <h3>附加包(filters)</h3>
    <div class="row">添加
      <select id="exsel">${filterPkgs.map(p => `<option>${esc(p.name)}</option>`).join("") || "<option value=''>无可选 filters 包</option>"}</select>
      <button id="addex">+ 附加包</button>
    </div>
    <table id="ext"><tr><th>包</th><th>filter</th><th>启用</th><th>参数(JSON)</th><th></th></tr></table>
    <div class="row"><button class="pri" id="saveu">保存</button> <button id="cancelu">取消</button></div>`;
  const tb = $("#ut");
  const addRow = t => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input class="tn" value="${esc(t.name || "")}"></td>
      <td><input class="tb" value="${esc(t.base_url || "")}" style="width:280px"></td>
      <td><select class="tt">${trOpts}</select></td>
      <td><input class="ts" type="password" value="${esc((t.secrets && t.secrets.api_key) || "")}" placeholder="留空保留旧值"></td>
      <td><input class="tw num" type="number" min="1" value="${t.weight > 0 ? t.weight : 1}" style="width:70px" title="加权随机权重"></td>
      <td><input class="te" type="checkbox" ${t.enabled !== false ? "checked" : ""}></td>`;
    tr.querySelector(".tt").value = t.transport || "";
    tb.appendChild(tr);
  };
  (u.targets || []).forEach(addRow);
  $("#addt").onclick = () => addRow({});
  const ext = $("#ext");
  const paramsOf = key => (u.filterParams && u.filterParams[key]) || {};
  const addExRow = (pkgName, filterName, on) => {
    const key = pkgName + "/" + filterName;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(pkgName)}</td><td>${esc(filterName)}</td>
      <td><input class="xe" type="checkbox" ${on ? "checked" : ""}></td>
      <td><input class="xp" style="width:280px" placeholder='{"model":"..."}' value='${esc(JSON.stringify(paramsOf(key)))}'></td>
      <td><button class="danger">移除</button></td>`;
    tr.querySelector("button").onclick = () => tr.remove();
    ext.appendChild(tr);
  };
  for (const ex of u.extras || []) {
    const pkg = allPkgs.find(p => p.name === ex.package);
    for (const fn of (pkg && pkg.filters) || []) {
      const key = ex.package + "/" + fn;
      addExRow(ex.package, fn, u.filtersEnabled ? u.filtersEnabled[key] !== false : true);
    }
  }
  $("#addex").onclick = () => {
    const pkgName = $("#exsel").value;
    if (!pkgName) return;
    const pkg = allPkgs.find(p => p.name === pkgName);
    for (const fn of (pkg && pkg.filters) || []) addExRow(pkgName, fn, true);
  };
  $("#cancelu").onclick = () => main.innerHTML = "";
  $("#saveu").onclick = async () => {
    const targets = [...tb.querySelectorAll("tr")].slice(1).map(tr => {
      const key = tr.querySelector(".ts").value;
      return {
        name: tr.querySelector(".tn").value,
        base_url: tr.querySelector(".tb").value,
        transport: tr.querySelector(".tt").value,
        enabled: tr.querySelector(".te").checked,
        weight: Math.max(1, parseInt(tr.querySelector(".tw").value, 10) || 1),
        // 编辑态留空 = 保留旧凭据,按后端契约发掩码
        secrets: { api_key: !isNew && !key ? "***" : key },
      };
    });
    const extras = [], filtersEnabled = {}, filterParams = {};
    const seen = new Set();
    for (const tr of [...ext.querySelectorAll("tr")].slice(1)) {
      const cells = tr.querySelectorAll("td");
      const pkgName = cells[0].textContent, filterName = cells[1].textContent;
      const key = pkgName + "/" + filterName;
      if (!seen.has(pkgName)) { extras.push({ package: pkgName }); seen.add(pkgName); }
      filtersEnabled[key] = tr.querySelector(".xe").checked;
      try { filterParams[key] = JSON.parse(tr.querySelector(".xp").value || "{}"); }
      catch (e) { msg(false, `参数 JSON 非法: ${key}`); return; }
    }
    const body = {
      id: u.id || 0, name: $("#un").value, enabled: $("#ue").checked,
      base: { package: $("#ub").value }, extras,
      models: $("#um").value.split(",").map(s => s.trim()).filter(Boolean),
      targets, params: u.params || {}, filterParams, filtersEnabled,
    };
    try {
      await api.call(isNew ? "POST" : "PUT", isNew ? "/upstreams" : `/upstreams/${u.id}`, body);
      msg(true, "已保存"); main.innerHTML = ""; showUpstreams();
    } catch (err) { msg(false, err.message); }
  };
}

/* ─── 包 ─── */
async function showPackages() {
  const pkgs = await api.get("/packages");
  $("#main").innerHTML = `
    <h2>包</h2>
    <div class="row">
      <button class="pri" id="ip">导入 .aap</button>
      <button id="iu">从 URL 导入</button>
      <a href="/packages/template"><button>下载模板包</button></a>
      <input type="file" id="fp" accept=".aap,.zip" style="display:none">
    </div>
    ${pkgs.length ? `<table>
      <tr><th>包</th><th>版本</th><th>revision</th><th>协议</th><th>filters</th><th></th></tr>
      ${pkgs.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.version)}</td><td class="num">${p.revision}</td>
        <td>${esc(p.protocol || "")}</td><td class="num">${p.filters}</td>
        <td style="white-space:nowrap">
          <a href="/admin/api/packages/${esc(p.name)}/export"><button>导出</button></a>
          <button data-keys="${esc(p.name)}">keys</button>
          <button class="danger" data-del="${esc(p.name)}">卸载</button>
        </td></tr>`).join("")}</table>`
      : `<div class="empty">还没有插件包。导入 .aap 文件或从 URL 拉取。</div>`}
    <div id="pmsg" class="muted"></div>
    <div id="keysbox" style="display:none">
      <h3>包级 keys <span id="keyspkg" class="muted"></span></h3>
      <pre class="log" id="keyspre"></pre>
    </div>
    <h3>在线编辑</h3>
    <div class="row">
      包 <select id="ep">${pkgs.map(p => `<option>${esc(p.name)}</option>`).join("")}</select>
      类型 <select id="ek"><option value="protocol">protocol</option><option value="filter">filter</option></select>
      filter 名 <input id="en" style="width:130px" placeholder="filter 时必填">
      <button id="load">载入</button> <button class="pri" id="save">保存(热生效)</button>
    </div>
    <textarea id="code" rows="18" spellcheck="false"></textarea>
    <div class="row muted">保存会替换部件源码并整包升级(revision+1),新请求立即使用新代码。</div>`;
  $("#load").onclick = async () => {
    try {
      const name = $("#ep").value, kind = $("#ek").value, fn = $("#en").value;
      const src = await api.get(`/packages/${name}/code?kind=${kind}${kind === "filter" ? "&name=" + fn : ""}`, true);
      $("#code").value = src;
    } catch (err) { msg(false, err.message); }
  };
  $("#save").onclick = async () => {
    try {
      const name = $("#ep").value, kind = $("#ek").value, fn = $("#en").value;
      const q = `?kind=${kind}${kind === "filter" ? "&name=" + fn : ""}`;
      await api.put(`/packages/${name}/code${q}`, $("#code").value);
      msg(true, "已保存,新请求热生效");
    } catch (err) { msg(false, err.message); }
  };
  $("#ip").onclick = () => $("#fp").click();
  const confirmSummary = async s => {
    const lines = [
      `包名: ${s.name}`, `版本: ${s.installedVersion ? s.version + " (已装 " + s.installedVersion + ",将升级)" : s.version}`,
      `协议: ${s.protocol || "-"}`, `形态: ${(s.form || []).join(",") || "-"}`,
      `能力: ${(s.features || []).join(",") || "-"}`,
      `filters: ${(s.filters || []).join(",") || "无"}`,
      `secretRefs: ${(s.secretRefs || []).join(",") || "无"}`,
      `hooks 任务: ${s.hooks ? (s.hooks.tasks || []).join(",") || "无任务" : "无"}`,
    ];
    return confirm("导入确认\n" + lines.join("\n") + "\n\n确认安装?");
  };
  $("#fp").onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    const bytes = new Uint8Array(await f.arrayBuffer());
    try {
      const s = await api.call("POST", "/packages/inspect", undefined, false, bytes);
      if (!(await confirmSummary(s))) return;
      const r = await fetch("/admin/api/packages", { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: bytes });
      if (!r.ok) throw new Error((await r.json()).error || "HTTP " + r.status);
      msg(true, "已安装"); showPackages();
    } catch (err) { msg(false, err.message); }
    e.target.value = "";
  };
  $("#iu").onclick = async () => {
    const url = prompt("包 URL (.aap):");
    if (!url) return;
    try {
      const s = await api.post("/packages/inspect", { url });
      if (!(await confirmSummary(s))) return;
      await api.post("/packages/import-url", { url });
      msg(true, "已安装"); showPackages();
    } catch (err) { msg(false, err.message); }
  };
  document.querySelectorAll("[data-keys]").forEach(b => b.onclick = async () => {
    try {
      const kv = await api.get(`/packages/${b.dataset.keys}/keys`);
      $("#keyspkg").textContent = b.dataset.keys;
      $("#keyspre").textContent = JSON.stringify(kv, null, 2);
      $("#keysbox").style.display = "block";
    } catch (err) { msg(false, err.message); }
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(`卸载包 ${b.dataset.del}?`)) return;
    try { await api.del(`/packages/${b.dataset.del}`); msg(true, "已卸载"); showPackages(); }
    catch (err) { msg(false, err.message); }
  });
}

/* ─── 监控 ─── */
async function showMonitor() {
  $("#main").innerHTML = `<h2>监控</h2><div class="muted">载入中…</div>`;
  let m, series, transports;
  try {
    [m, series, transports] = await Promise.all([
      api.get("/metrics/live"), api.get("/metrics/series?minutes=60"), api.get("/transports")]);
  } catch (err) {
    $("#main").innerHTML = `<h2>监控</h2>
      <div class="empty">监控数据加载失败: ${esc(err.message)}<br><button class="pri" id="monretry">重试</button></div>`;
    $("#monretry").onclick = showMonitor;
    return;
  }
  series = series || [];
  const reqs = series.map(p => p.requests);
  const rpmNow = m.total_requests || 0;
  const rpmAvg = reqs.length ? reqs.reduce((a, b) => a + b, 0) / reqs.length : 0;
  const rpmPeak = reqs.length ? Math.max(...reqs) : 0;
  const errRate = m.total_requests > 0 ? (m.total_errors * 100 / m.total_requests) : null;
  $("#main").innerHTML = `
    <div class="titlerow"><h2>监控</h2><button id="monrf">刷新</button></div>
    <div class="pulse">
      <div class="big">
        <div class="v num" id="rpm-now">${fmt(rpmNow)}</div>
        <div class="l"><b>RPM</b> 当前分钟请求数</div>
      </div>
      <canvas id="spark" width="200" height="52"></canvas>
    </div>
    <div class="stats">
      <div class="stat"><div class="v acc num" id="rpm-avg">${rpmAvg.toFixed(1)}</div><div class="l">平均 RPM(近 60 分钟)</div></div>
      <div class="stat"><div class="v num" id="rpm-peak">${fmt(rpmPeak)}</div><div class="l">峰值 RPM(近 60 分钟)</div></div>
      <div class="stat"><div class="v ${errRate !== null && errRate > 0 ? "err" : ""} num" id="err-rate">${errRate === null ? "—" : errRate.toFixed(1) + "%"}</div><div class="l">错误率(当前分钟)</div></div>
      <div class="stat"><div class="v warn num" id="conc">${fmt(m.active_concurrent)}</div><div class="l">并发</div></div>
    </div>
    <h3>分钟时序(近 60 分钟)</h3>
    <canvas id="chart" width="1020" height="240" style="border:1px solid var(--line-soft);border-radius:8px;max-width:100%"></canvas>
    <div class="muted row"><span style="color:var(--acc)">—</span> 请求数&nbsp;&nbsp;<span style="color:var(--err)">—</span> 错误数</div>
    <h3>传输实例</h3>
    ${(transports || []).length ? `<table>
      <tr><th>名称</th><th>地址</th><th></th></tr>
      ${(transports || []).map(t => `<tr><td>${esc(t.name)}</td>
        <td class="muted">${esc(t.url || "direct")}</td>
        <td><button data-tt="${esc(t.name)}">测试连通</button> <span id="tr-${esc(t.name)}" class="muted"></span></td></tr>`).join("")}</table>`
      : `<div class="empty">未配置传输实例,目标默认直连。</div>`}
    <h3>按上游</h3><pre class="log" id="byup">${esc(JSON.stringify(m.by_upstream, null, 2))}</pre>
    <h3>按目标</h3><pre class="log" id="bytg">${esc(JSON.stringify(m.by_target, null, 2))}</pre>`;
  drawSpark(series.slice(-12).map(p => p.requests));
  drawChart(series);
  $("#monrf").onclick = showMonitor;
  document.querySelectorAll("[data-tt]").forEach(b => b.onclick = async () => {
    const span = $("#tr-" + CSS.escape(b.dataset.tt));
    span.textContent = "测试中…";
    try {
      const r = await api.post(`/transports/${b.dataset.tt}/test`, {});
      span.textContent = r.ok ? `通 ${r.latency_ms}ms` : `断: ${r.error}`;
      span.style.color = r.ok ? "var(--acc)" : "var(--err)";
    } catch (err) { span.textContent = err.message; span.style.color = "var(--err)"; }
  });
}

function drawSpark(values) {
  const cv = $("#spark"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = "#2A3A32";
  ctx.strokeRect(0.5, 0.5, cv.width - 1, cv.height - 1);
  if (!values || values.length < 2) {
    ctx.fillStyle = "#5C6F64"; ctx.font = "11px system-ui";
    ctx.fillText("暂无走势", 12, 30);
    return;
  }
  const maxV = Math.max(1, ...values), pad = 4;
  const x = i => pad + (cv.width - 2 * pad) * i / (values.length - 1);
  const y = v => cv.height - pad - (cv.height - 2 * pad) * (v / maxV);
  ctx.beginPath();
  ctx.moveTo(x(0), cv.height - pad);
  values.forEach((v, i) => ctx.lineTo(x(i), y(v)));
  ctx.lineTo(x(values.length - 1), cv.height - pad);
  ctx.closePath();
  ctx.fillStyle = "rgba(79,214,184,.14)";
  ctx.fill();
  ctx.beginPath();
  values.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
  ctx.strokeStyle = "#4FD6B8"; ctx.lineWidth = 1.6; ctx.stroke();
}

function drawChart(series) {
  const cv = $("#chart"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!series || !series.length) {
    ctx.fillStyle = "#5C6F64"; ctx.font = "13px system-ui";
    ctx.fillText("暂无时序数据(每分钟落一次库;有流量后这里会出现分钟曲线)", 20, 44);
    return;
  }
  const W = cv.width, H = cv.height, pad = 34, padR = 16;
  const maxV = Math.max(1, ...series.map(p => Math.max(p.requests, p.errors)));
  const x = i => pad + (W - pad - padR) * (series.length === 1 ? 0.5 : i / (series.length - 1));
  const y = v => H - pad - (H - pad - 14) * (v / maxV);
  ctx.strokeStyle = "#1B2721";
  for (let g = 0; g <= 4; g++) {
    const gy = y(maxV * g / 4);
    ctx.beginPath(); ctx.moveTo(pad, gy); ctx.lineTo(W - padR, gy); ctx.stroke();
    ctx.fillStyle = "#5C6F64"; ctx.font = "11px ui-monospace";
    ctx.fillText(String(Math.round(maxV * g / 4)), 6, gy + 4);
  }
  const area = (key, fill) => {
    ctx.beginPath();
    ctx.moveTo(x(0), y(0));
    series.forEach((p, i) => ctx.lineTo(x(i), y(p[key])));
    ctx.lineTo(x(series.length - 1), y(0));
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  };
  const line = (key, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 1.6;
    ctx.beginPath();
    series.forEach((p, i) => i ? ctx.lineTo(x(i), y(p[key])) : ctx.moveTo(x(i), y(p[key])));
    ctx.stroke();
  };
  area("requests", "rgba(79,214,184,.10)");
  line("requests", "#4FD6B8");
  line("errors", "#F26D5B");
  ctx.fillStyle = "#5C6F64"; ctx.font = "11px ui-monospace";
  ctx.fillText(series[0].minute, pad, H - 6);
  const last = series[series.length - 1].minute;
  ctx.fillText(last, W - padR - ctx.measureText(last).width, H - 6);
}

  try { await api.get("/me"); show("ups"); } catch (e) { show("login"); }
